apiVersion: v1
data:
  init.sql: "-- 1. СОЗДАНИЕ ТАБЛИЦ\r\n\r\n-- Таблица пользователей\r\nCREATE TABLE
    users (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    name VARCHAR(100) NOT NULL,\r\n
    \   email VARCHAR(100) UNIQUE NOT NULL,\r\n    password VARCHAR(255) NOT NULL,\r\n
    \   role VARCHAR(20) NOT NULL CHECK (role IN ('PATIENT', 'ADMIN', 'CLINIC_ADMIN')),\r\n
    \   managed_clinic_id BIGINT NULL,\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- Таблица клиник\r\nCREATE
    TABLE clinics (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    name VARCHAR(200) NOT
    NULL,\r\n    address VARCHAR(300) NOT NULL,\r\n    phone VARCHAR(50),\r\n    hours
    VARCHAR(200),\r\n    site_url VARCHAR(200),\r\n    latitude DOUBLE PRECISION,\r\n
    \   longitude DOUBLE PRECISION,\r\n    logo_url VARCHAR(500),\r\n    work_start
    TIME DEFAULT '09:00',\r\n    work_end TIME DEFAULT '20:00',\r\n    work_days VARCHAR(50)
    DEFAULT 'MON,TUE,WED,THU,FRI',\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- Таблица врачей\r\nCREATE
    TABLE doctors (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    name VARCHAR(150) NOT
    NULL,\r\n    specialization VARCHAR(200),\r\n    experience INTEGER,\r\n    education
    TEXT,\r\n    photo_url VARCHAR(500),\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- Связь врачей
    с клиниками\r\nCREATE TABLE clinic_doctors (\r\n    clinic_id BIGINT NOT NULL,\r\n
    \   doctor_id BIGINT NOT NULL,\r\n    PRIMARY KEY (clinic_id, doctor_id),\r\n
    \   FOREIGN KEY (clinic_id) REFERENCES clinics(id) ON DELETE CASCADE,\r\n    FOREIGN
    KEY (doctor_id) REFERENCES doctors(id) ON DELETE CASCADE\r\n);\r\n\r\n-- Таблица
    услуг\r\nCREATE TABLE dental_services (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    name
    VARCHAR(200) NOT NULL,\r\n    description TEXT,\r\n    price DECIMAL(10, 2),\r\n
    \   created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    updated_at TIMESTAMP
    DEFAULT CURRENT_TIMESTAMP\r\n);\r\n\r\n-- Связь клиник с услугами\r\nCREATE TABLE
    clinic_services (\r\n    clinic_id BIGINT NOT NULL,\r\n    service_id BIGINT NOT
    NULL,\r\n    price DECIMAL(10, 2),\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    PRIMARY KEY (clinic_id,
    service_id),\r\n    FOREIGN KEY (clinic_id) REFERENCES clinics(id) ON DELETE CASCADE,\r\n
    \   FOREIGN KEY (service_id) REFERENCES dental_services(id) ON DELETE CASCADE\r\n);\r\n\r\n--
    Таблица отзывов\r\nCREATE TABLE reviews (\r\n    id BIGSERIAL PRIMARY KEY,\r\n
    \   rating INTEGER NOT NULL CHECK (rating >= 1 AND rating <= 5),\r\n    comment
    TEXT,\r\n    patient_id BIGINT NOT NULL,\r\n    clinic_id BIGINT NOT NULL,\r\n
    \   created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    updated_at TIMESTAMP
    DEFAULT CURRENT_TIMESTAMP,\r\n    FOREIGN KEY (patient_id) REFERENCES users(id)
    ON DELETE CASCADE,\r\n    FOREIGN KEY (clinic_id) REFERENCES clinics(id) ON DELETE
    CASCADE\r\n);\r\n\r\n-- Таблица записей на приём\r\nCREATE TABLE appointments
    (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    date_time TIMESTAMP NOT NULL,\r\n    status
    VARCHAR(20) DEFAULT 'PENDING' CHECK (status IN ('PENDING', 'CONFIRMED', 'CANCELLED',
    'COMPLETED')),\r\n    patient_id BIGINT NOT NULL,\r\n    doctor_id BIGINT NOT
    NULL,\r\n    clinic_id BIGINT NOT NULL,\r\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n
    \   updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    FOREIGN KEY (patient_id)
    REFERENCES users(id) ON DELETE CASCADE,\r\n    FOREIGN KEY (doctor_id) REFERENCES
    doctors(id) ON DELETE CASCADE,\r\n    FOREIGN KEY (clinic_id) REFERENCES clinics(id)
    ON DELETE CASCADE\r\n);\r\n\r\n-- Таблица медицинских карт\r\nCREATE TABLE medical_records
    (\r\n    id BIGSERIAL PRIMARY KEY,\r\n    diagnosis VARCHAR(300),\r\n    notes
    TEXT,\r\n    patient_id BIGINT NOT NULL,\r\n    doctor_id BIGINT NOT NULL,\r\n
    \   created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    updated_at TIMESTAMP
    DEFAULT CURRENT_TIMESTAMP,\r\n    FOREIGN KEY (patient_id) REFERENCES users(id)
    ON DELETE CASCADE,\r\n    FOREIGN KEY (doctor_id) REFERENCES doctors(id) ON DELETE
    CASCADE\r\n);\r\n\r\n-- Избранные клиники\r\nCREATE TABLE favorite_clinics (\r\n
    \   user_id BIGINT NOT NULL,\r\n    clinic_id BIGINT NOT NULL,\r\n    created_at
    TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\r\n    PRIMARY KEY (user_id, clinic_id),\r\n
    \   FOREIGN KEY (user_id) REFERENCES users(id) ON DELETE CASCADE,\r\n    FOREIGN
    KEY (clinic_id) REFERENCES clinics(id) ON DELETE CASCADE\r\n);\r\n\r\n-- 2. ВНЕШНИЕ
    КЛЮЧИ\r\n\r\nALTER TABLE users ADD CONSTRAINT fk_users_managed_clinic\r\n    FOREIGN
    KEY (managed_clinic_id) REFERENCES clinics(id) ON DELETE SET NULL;\r\n\r\n-- 3.
    ЗАПОЛНЕНИЕ КЛИНИК\r\n\r\nINSERT INTO clinics (id, name, address, phone, hours,
