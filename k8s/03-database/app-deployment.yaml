apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-uploads
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dental-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dental-app
  template:
    metadata:
      labels:
        app: dental-app
    spec:
      containers:
        - name: app
          image: dental-clinic-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: app-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: dental-app
spec:
  type: NodePort
  selector:
    app: dental-app
  ports:
    - port: 8085
      targetPort: 8085