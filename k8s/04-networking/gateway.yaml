apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dental-gateway
  namespace: dental-clinic
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: http
      hostname: gateway.dental.local
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
