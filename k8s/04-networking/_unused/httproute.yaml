apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend
  namespace: dental-clinic
spec:
  parentRefs:
    - name: dental-gateway
      sectionName: http
  hostnames:
    - gateway.dental.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: backend
          port: 8085
