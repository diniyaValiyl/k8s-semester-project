apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dental-clinic
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dental-clinic
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
