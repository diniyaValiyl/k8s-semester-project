apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dental-clinic
  namespace: dental-clinic
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-cluster-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dental.local
        - api.dental.local
      secretName: dental-local-tls
  rules:
    - host: dental.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: api.dental.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8085
