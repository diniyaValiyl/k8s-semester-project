apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-watcher
  namespace: dental-clinic
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dental-clinic
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-watcher-read-pods
  namespace: dental-clinic
subjects:
  - kind: ServiceAccount
    name: pod-watcher
    namespace: dental-clinic
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io