apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-watcher
  namespace: dental-clinic
  labels:
    app.kubernetes.io/name: pod-watcher
    app.kubernetes.io/part-of: dental-clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-watcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-watcher
        app.kubernetes.io/part-of: dental-clinic
    spec:
      serviceAccountName: pod-watcher
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pod-watcher
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --no-cache-dir --target /tmp/pylibs kubernetes requests &&
              cd /app && PYTHONPATH=/tmp/pylibs:/app python main.py
          env:
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: topic
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /tmp
            - name: PIP_CACHE_DIR
              value: /tmp/pip-cache
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: code
          configMap:
            name: pod-watcher-code
        - name: tmp
          emptyDir: {}